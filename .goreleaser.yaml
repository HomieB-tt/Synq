version: 2

project_name: synq

builds:
  - id: synq
    main: ./cmd/synq
    binary: synq
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    flags:
      - -trimpath
    ldflags:
      - -s -w
      # Bake in the default synq-server so users only download, run and
      # register. Set the SYNQ_DEFAULT_SERVER_URL repository variable;
      # when it is unset the binary asks for a server on first run.
      - -X main.defaultServerURL={{ envOrDefault "SYNQ_DEFAULT_SERVER_URL" "" }}

archives:
  - formats:
      - tar.gz
    format_overrides:
      - goos: windows
        formats:
          - zip
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - README.md
      - LICENSE

checksum:
  name_template: checksums.txt

release:
  draft: true
